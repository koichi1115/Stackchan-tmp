; 非公式ファームウェア。役割は「録音してリレーへ送る」「返ってきた音を鳴らす」だけです。
; 鍵やトークンは一切持ちません。設定は include/config.h（Git 管理外）にあります。

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
	-DCORE_DEBUG_LEVEL=1
lib_deps =
	m5stack/M5Unified@^0.2.2
	meganetaaan/M5Stack-Avatar@^0.10.0

[env:core2]
extends = env
board = m5stack-core2

[env:cores3]
extends = env
board = m5stack-cores3

[env:fire]
extends = env
board = m5stack-fire
